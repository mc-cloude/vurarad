[project]
name = "vurarad"
version = "0.1.0"
description = "vuraRAD — radiology AI reading and research platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.1",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-logging>=3.11.0",
    "google-genai==2.16.0",
    "firebase-admin>=6.5.0",
    "pydicom>=3.0.0",
    "Pillow>=10.0.0",
    "python-ulid>=3.0.0",
    "cryptography>=43.0.0",
    "httpx>=0.28.0",
    "boto3>=1.34.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["tests/", ".venv/"]
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"

[[tool.mypy.overrides]]
module = ["google.cloud", "google.cloud.*", "google.api_core", "google.api_core.*", "boto3", "botocore.*"]
ignore_missing_imports = true
