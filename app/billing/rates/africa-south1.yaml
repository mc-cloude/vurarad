  studies_ingested:        { unit: count,    unit_cost_usd: 0.0334 }
  ai_draft_requests:       { unit: count,    unit_cost_usd: 0.0 }
  ai_draft_tokens:         { unit: tokens,   unit_cost_usd: 0.0000015 }
  ai_qa_requests:          { unit: count,    unit_cost_usd: 0.0 }
  ai_qa_tokens:            { unit: tokens,   unit_cost_usd: 0.0000015 }
  segmentation_inferences: { unit: count,    unit_cost_usd: 0.02 }
  dicomweb_qido:           { unit: count,    unit_cost_usd: 0.000004 }
  dicomweb_wado:           { unit: count,    unit_cost_usd: 0.000004 }
  dicomweb_stow:           { unit: count,    unit_cost_usd: 0.000005 }
  storage_bytes_month:     { unit: GB-month, unit_cost_usd: 0.023 }
  egress_bytes:            { unit: GB,       unit_cost_usd: 0.085 }
  reports_signed:          { unit: count,    unit_cost_usd: 0.0 }
