# vuraRAD rate card — africa-south1
# Per-meter unit costs in USD. This is a DATA file: a service module never
# hardcodes any of these values. Effective date governs which card is active.
region: africa-south1
effective_date: "2026-01-01"
version: "2026-01"
currency: USD
# Images covered by the monthly infrastructure ceiling (D18: ~300 studies /
# ~120,000 images). Overage is metered beyond this from images_ingested.
included_images_per_month: 120000
rates:
