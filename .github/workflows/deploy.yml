# Deploy to Cloud Run on push to main.
# Plan reference: backend-plan.md §10.5
#
# Uses Workload Identity Federation — no service-account JSON key.
# Deploys with --no-traffic, smoke-checks the new revision, then shifts traffic.
# The SPA publish (AWS S3 + CloudFront via GitHub OIDC) runs after the API
# traffic shift so a new SPA never calls an endpoint the old API lacks.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for WIF

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if CI on this commit has succeeded.
    needs: []
    env:
      IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vurarad/vurarad-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # 1. Authenticate to GCP via Workload Identity Federation (no JSON key).
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: vurarad-deploy@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # 2. Build + push digest-pinned image to Artifact Registry.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      # 3. Deploy with --no-traffic (revision created, traffic held).
      - name: Deploy revision
        run: |
          gcloud run deploy vurarad-api \
            --image "$IMAGE" \
            --region us-central1 \
            --no-traffic \
            --no-allow-unauthenticated

      # 4. Smoke check the new revision's tag URL.
      - name: Smoke check
        run: |
          TAG_URL=$(gcloud run services describe vurarad-api --region us-central1 \
            --format='value(status.traffic[0].url)')
          # /readyz must report ok
          curl -fsS "$TAG_URL/readyz" | grep -q '"status":"ok"'
          # unauthenticated request must be 401, never a defaulted role
          test "$(curl -s -o /dev/null -w '%{http_code}' "$TAG_URL/api/v1/studies")" = "401"
          # /docs must be 404 in production
          test "$(curl -s -o /dev/null -w '%{http_code}' "$TAG_URL/docs")" = "404"

      # 5. Shift traffic to the new revision on success.
      - name: Shift traffic
        run: gcloud run services update-traffic vurarad-api --region us-central1 --to-latest

  # 6. Publish the SPA after the API traffic shift (D1).
  publish-spa:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CDN_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Sync SPA bundle
        run: aws s3 sync dist/ s3://vurarad-spa/ --delete
      - name: Invalidate CloudFront entry document
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} --paths "/index.html" "/"
