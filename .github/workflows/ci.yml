# WP1 CI — lint/type, unit + integration tests with coverage, Docker build.
# Plan reference: backend-plan.md §10.5
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------- lint-type
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff mypy
      - name: ruff check
        run: ruff check app/ tests/
      - name: ruff format --check
        run: ruff format --check app/ tests/
      - name: mypy --strict
        run: mypy --strict app/

  # --------------------------------------------------------------------- test
  test:
    runs-on: ubuntu-latest
    # Firestore emulator as a service container for integration tests.
    services:
      firestore:
        image: mtlynch/firestore-emulator
        ports:
          - 8200:8200
        env:
          FIRESTORE_PROJECT_ID: vurarad-test
          PORT: 8200
    env:
      FIRESTORE_EMULATOR_HOST: localhost:8200
      FIRESTORE_PROJECT_ID: vurarad-test
      # Minimal env so Settings() boots without real GCP creds (fail-fast still
      # rejects a missing required field — tested in test_config.py).
      GCP_PROJECT_ID: vurarad-test
      GCP_REGION: us-central1
      PIXEL_BUCKET_NAME: pixels
      AUDIT_BUCKET_NAME: audit
      FIREBASE_PROJECT_ID: vurarad-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov httpx
      - name: unit tests + coverage
        run: pytest tests/unit -q --cov=app --cov-fail-under=85
      - name: integration tests
        run: pytest tests/integration -q

  # -------------------------------------------------------------------- build
  build:
    runs-on: ubuntu-latest
    needs: [lint-type, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vurarad-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export OpenAPI schema
        run: |
          docker run --rm \
            -e GCP_PROJECT_ID=vurarad-test \
            -e GCP_REGION=us-central1 \
            -e PIXEL_BUCKET_NAME=pixels \
            -e AUDIT_BUCKET_NAME=audit \
            -e FIREBASE_PROJECT_ID=vurarad-test \
            vurarad-api:ci \
            python -m app.tools.export_openapi > openapi.json
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi.json
